# Completado por Claude: misma configuración base del parcial
spring:
  application:
    name: Wok-System
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/wok_system}   # local por defecto

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:}               # Base64, mínimo 44 caracteres. Nunca hardcodeado
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
