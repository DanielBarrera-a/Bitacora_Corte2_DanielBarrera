# Misma configuración base del parcial
spring:
  application:
    name: Wok-System
  # Spring Boot 4: la propiedad es spring.mongodb.uri (en Boot 3 era spring.data.mongodb.uri).
  # Si se usa el nombre viejo, Spring la ignora y se conecta a localhost:27017/test.
  # ${MONGODB_URI:valor} = usa la variable de entorno; si no existe, el valor por defecto.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/wok_system}   # local por defecto

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:}               # Base64, mínimo 44 caracteres. Nunca hardcodeado
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
